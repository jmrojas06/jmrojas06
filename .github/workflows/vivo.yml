name: Actualizar lo último que subí

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/vivo.mjs'
      - '.github/workflows/vivo.yml'

permissions:
  contents: write

jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reescribir el bloque del README
        run: node .github/scripts/vivo.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir el cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Actualizar lo último que subí" && git push)
